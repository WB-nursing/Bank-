<style>
:root{--bg:#f8fafc;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e5e7eb;--ok:#22c55e;--no:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--bd:#334155}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,sans-serif;min-height:100vh}
.w{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:20px;box-shadow:0 4px 24px rgba(15,23,42,.08);padding:20px;margin-bottom:14px;animation:in .28s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font-size:32px;margin:8px 0;text-align:center}.sub{text-align:center;color:var(--mut)}
.salat{background:linear-gradient(135deg,#fef3c7,#fde68a,#fcd34d);border:2px solid rgba(245,158,11,.25);border-radius:24px;text-align:center;padding:20px;margin:14px 0;box-shadow:0 0 30px rgba(245,158,11,.25)}
.salat b{display:block;font-family:Amiri,serif;font-size:26px;color:#92400e}.salat i{font-size:14px;color:#b45309}
.chip{display:inline-block;padding:4px 12px;border-radius:99px;color:#fff;font-size:13px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tp{display:flex;gap:10px;align-items:center;margin:8px 0}
button{font-family:inherit;cursor:pointer;min-height:44px}
.cta{display:block;margin:16px auto;width:100%;max-width:420px;height:60px;border:0;border-radius:16px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-size:20px;font-weight:700;animation:pu 2.5s infinite}
@keyframes pu{50%{transform:scale(1.02)}}
.sm{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:5;flex-wrap:wrap}
.pb{height:5px;background:var(--bd)}.pb div{height:100%;transition:width .3s}
.q{font-family:Inter,sans-serif;font-size:1.25rem;font-weight:600;line-height:1.7;direction:ltr;text-align:left;margin:10px 0}
.ar{overflow:hidden;max-height:0;opacity:0;transition:.28s;background:var(--bd);border-radius:10px;direction:rtl}
.ar.on{max-height:600px;opacity:1;padding:10px;margin:6px 0}
.o{display:flex;gap:10px;align-items:center;width:100%;min-height:64px;margin:8px 0;padding:10px 14px;border:2px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font-family:Inter,sans-serif;font-size:16px;text-align:left;direction:ltr;transition:.28s}
.o:hover:not(:disabled){transform:translateY(-2px);border-color:var(--g)}
.o:disabled{opacity:.9;cursor:default}
.o .l{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:var(--gr)}
.o small{display:none;font-family:Cairo;font-size:13px;opacity:.75;border-top:1px dotted currentColor;margin-top:4px;padding-top:4px;direction:rtl;text-align:right}
.tr .o small:not(:empty){display:block}
.o.ok{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border-color:transparent}
.o.no{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border-color:transparent}
.o.rv{border-color:var(--ok)}
.ex{margin-top:12px;border-radius:16px;padding:14px;background:var(--bd)}
.ex .e{background:var(--card);border-radius:10px;padding:10px;direction:ltr;text-align:left;font-family:Inter;font-size:15px;margin:8px 0}
.nx{width:100%;border:0;border-radius:12px;color:#fff;font-weight:700;font-size:16px;background:var(--gr)}
.ring{display:block;margin:auto}
.bar{height:10px;border-radius:9px;background:var(--bd);overflow:hidden}.bar div{height:100%}
details{border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin:6px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
@media print{.top,.cta,.sm{display:none}}
</style>

$('#rv').innerHTML=L.map(q=>{const a=state.ans[q.id],st=a==null?'⊘':a===q._ci?'✅':'❌';return `<details><summary>${st} <span class="chip" style="background:${q.gradient}">${q.topicNameEn}</span> ${esc(q.questionEn)}</summary><div style="direction:rtl">${esc(q.questionAr)}</div><p>إجابتك: ${a==null?'—':esc(q.options[q._ord[a]].en)+' / '+esc(q.options[q._ord[a]].ar)}</p><p>الصحيحة: ${esc(q.options[q.correctIndex].en)} / ${esc(q.options[q.correctIndex].ar)}</p><div class="ex"><div class="e">${esc(q.expEn)}</div><div style="direction:rtl">${esc(q.expAr)}</div></div></details>`}).join('')||'<p class="sub">لا توجد عناصر</p>'}
function confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:9';document.body.appendChild(c);c.width=innerWidth;c.height=innerHeight;const x=c.getContext('2d'),P=[...Array(120)].map(()=>({x:Math.random()*c.width,y:-20,v:2+Math.random()*4,s:4+Math.random()*6,h:Math.random()*360}));let f=0;(function d(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;x.fillStyle=`hsl(${p.h},80%,55%)`;x.fillRect(p.x,p.y,p.s,p.s)});if(++f<200)requestAnimationFrame(d);else c.remove()})()}
function render(){({welcome:renderWelcome,quiz:renderQuestion,results:renderResults})[state.mode]()}
document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;const k=e.key.toLowerCase();
if(k==='m'){state.st.soundOn=!state.st.soundOn;saveSettings();render();return}
if(state.mode!=='quiz')return;const q=state.list[state.i],done=state.ans[q.id]!=null;
if('1234'.includes(k)&&k.length===1)selectOption(+k-1);else if('abcd'.includes(k)&&k.length===1)selectOption('abcd'.indexOf(k));
else if((k==='enter'||k===' ')&&done){e.preventDefault();nextQuestion()}else if(k==='r')toggleTranslation();else if(k==='escape')confirmExit()});
function init(){applyTheme(state.st.theme);applyLanguage(state.st.lang);if(!loadProgress())state.mode='welcome';render()}
init();
