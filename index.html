<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pediatric Surgery | The Coding Nurse (A&M)🩺💉</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --primary:#0f4c81;
  --secondary:#0ea5e9;
  --success:#22c55e;
  --danger:#dc2626;
  --bg:#f1f5f9;
  --soft:#f8fafc;
  --text:#0f172a;
}
*{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}
.container{max-width:1000px;margin:auto;padding:16px}

/* Header */
.hero{
  text-align:center;
  padding:36px 20px;
  border-radius:22px;
  background:linear-gradient(135deg,#0f4c81,#0ea5e9);
  color:#fff;
  margin-bottom: 20px;
}
.hero h1{margin:0;font-size:34px;font-weight:800}
.hero h2{
  margin-top:6px;
  font-size:18px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#bbf7d0;
}

/* Middle Nav */
.mid-nav{
  display:flex;
  gap:10px;
  margin:24px 0;
  padding:6px 4px;
  overflow-x:auto;
}
.q-btn{
  min-width:44px;
  padding:10px 0;
  border-radius:12px;
  border:2px solid #e5e7eb;
  background:#fff;
  font-weight:700;
  cursor:pointer;
}
.q-btn.active{background:#dbeafe;border-color:var(--secondary)}
.q-btn.correct{background:#dcfce7;border-color:var(--success)}
.q-btn.wrong{background:#fee2e2;border-color:var(--danger)}

/* Card */
.card{
  background:#fff;
  border-radius:22px;
  padding:24px;
  box-shadow:0 14px 35px rgba(0,0,0,.08);
  text-align: center;
}

/* Welcome Screen */
.welcome-msg { font-size: 24px; color: var(--primary); font-weight: 700; margin-bottom: 20px; }
.start-btn {
  padding: 16px 40px;
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, var(--success), #16a34a);
  border: none;
  border-radius: 16px;
  cursor: pointer;
  transition: transform 0.2s;
}
.start-btn:hover { transform: scale(1.05); }

/* Progress Bar */
.progress{
  height:8px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
  margin-bottom:18px;
}
.progress span{
  display:block;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--secondary),var(--success));
}

/* Question Section */
.question-box{
  background:linear-gradient(135deg,#ffffff,#f0f7ff);
  border-left:6px solid var(--secondary);
  border-radius:18px;
  padding:22px;
  text-align: left;
}
.question{
  font-size:18px;
  font-weight:600;
  margin-bottom:20px;
}

/* Options */
.options button{
  width:100%;
  padding:15px;
  margin-bottom:12px;
  border-radius:14px;
  border:2px solid #e5e7eb;
  background:var(--soft);
  font-size:16px;
  cursor:pointer;
  transition: 0.2s;
}
.options button.correct{background:#ecfdf5;border-color:var(--success)}
.options button.wrong{background:#fef2f2;border-color:var(--danger)}

/* Navigation Buttons */
.nav{
  display:flex;
  gap:12px;
  margin-top:26px;
}
.nav button{
  flex:1;
  padding:14px;
  border-radius:14px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}
.prev{background:#fff;border:2px solid #e5e7eb}
.next{
  border:none;
  color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
}

/* Topic tag & Explanation */
.topic{display:inline-block;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--primary);background:#dbeafe;padding:4px 12px;border-radius:999px;margin-bottom:12px}
.options button{text-align:left}
.expl{display:none;margin-top:16px;padding:16px;border-radius:14px;background:#f0fdf4;border:1px solid #bbf7d0}
.expl.show{display:block}
.expl .ar{direction:rtl;text-align:right;font-weight:600;margin-bottom:10px;line-height:1.7}
.expl .en{direction:ltr;text-align:left;color:#334155;line-height:1.6;font-size:15px}
.mid-nav{flex-wrap:wrap;overflow-x:visible}
.review{text-align:left;margin-top:10px}
/* Result Screen */
.result-msg { font-size: 18px; margin-bottom: 10px; line-height: 1.6; }
.duck-msg { 
  display: block; 
  margin-top: 15px; 
  font-weight: 800; 
  color: var(--primary);
  font-size: 20px;
}
.score{font-size:40px;font-weight:800;color:var(--success); margin: 15px 0;}
.restart{
  margin-top:20px;
  padding:14px 24px;
  border:none;
  border-radius:16px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(135deg,#0f4c81,#0ea5e9);
}
</style>
</head>

<div class="container">
    <div class="hero">

    <div class="card result" id="resultCard" style="display:none">

            <span class="duck-msg">( 🐥 أشطر كتكوت يخواشي )</span>
        </div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <h2>Final Result</h2>
        <div class="score" id="scoreText"></div>
        <button class="restart" onclick="restartQuiz()">🔄 Restart Quiz</button>

</div>

   "C. Cystoscopy",
   "D. Routine chest radiography"
  ],
  "a": 1,
  "ar": "لأن المنظار البطني التشخيصي يساعد في تحديد الخصية غير الملموسة وإدارتها.",
  "en": "Because diagnostic laparoscopy helps locate and manage a nonpalpable testis."
 },
 {
  "t": "Undescended Testis (UDT)",
  "q": "During examination, a 4-year-old boy's testis can be manipulated into the dependent scrotum and remains there without tension after the cremasteric reflex is fatigued. The testis is normal in size. What is the most appropriate management?",
  "o": [
   "A. Immediate inguinal orchiopexy.",
   "B. Routine annual examination to detect possible secondary ascent.",
   "C. Hormonal therapy to secure descent.",
   "D. Diagnostic laparoscopy."
  ],
  "a": 1,
  "ar": "لأن هذه خصية مرتدة retractile وليست غير نازلة ثابتة، فلا تحتاج جراحة فورية لكن تحتاج متابعة.",
  "en": "Because this is a retractile testis, not a fixed UDT; surgery is not indicated, but follow-up is needed."
 }
];

let i=0,score=0;
const answers=new Array(quiz.length).fill(null);
const qDiv=document.getElementById("question"),
      oDiv=document.getElementById("options"),
      progress=document.getElementById("progressBar"),
      midNav=document.getElementById("midNav"),
      quizContainer=document.getElementById("quizContainer"),
      startCard=document.getElementById("startCard"),
      resultCard=document.getElementById("resultCard"),
      scoreText=document.getElementById("scoreText"),
      topicEl=document.getElementById("topic"),
      expl=document.getElementById("expl"),
      explAr=document.getElementById("explAr"),
      explEn=document.getElementById("explEn");

quiz.forEach((_,idx)=>{
  const b=document.createElement("button");
  b.textContent=idx+1;
  b.className="q-btn";
  b.onclick=()=>{i=idx;load()};
  midNav.appendChild(b);
});

function startQuiz(){ startCard.style.display="none"; quizContainer.style.display="block"; load(); }

function updateMidNav(){
  document.querySelectorAll(".q-btn").forEach((el,idx)=>{
    el.classList.remove("active","correct","wrong");
    if(idx===i) el.classList.add("active");
    if(answers[idx]===true) el.classList.add("correct");
    if(answers[idx]===false) el.classList.add("wrong");
  });
}

function showExpl(){
  explAr.textContent="💡 "+quiz[i].ar;
  explEn.textContent=quiz[i].en;
  expl.classList.add("show");
}

function load(){
  topicEl.textContent=quiz[i].t+"  •  "+(i+1)+" / "+quiz.length;
  qDiv.textContent=quiz[i].q;
  oDiv.innerHTML="";
  expl.classList.remove("show");
  progress.style.width=(i/quiz.length)*100+"%";
  updateMidNav();
  quiz[i].o.forEach((op,idx)=>{
    const b=document.createElement("button");
    b.textContent=op;
    if(answers[i]!==null){
      b.disabled=true;
      if(idx===quiz[i].a) b.classList.add("correct");
      else if(idx===quiz[i].userPick) b.classList.add("wrong");
    }
    b.onclick=()=>answer(idx,b);
    oDiv.appendChild(b);
  });
  if(answers[i]!==null) showExpl();
}

function answer(idx,btn){
  if(answers[i]!==null) return;
  quiz[i].userPick=idx;
  document.querySelectorAll(".options button").forEach(b=>b.disabled=true);
  if(idx===quiz[i].a){ btn.classList.add("correct"); answers[i]=true; score++; }
  else{ btn.classList.add("wrong"); oDiv.children[quiz[i].a].classList.add("correct"); answers[i]=false; }
  showExpl();
  updateMidNav();
}

function nextQ(){ if(i<quiz.length-1){i++;load()} else showResult(); }
function prevQ(){ if(i>0){i--;load()} }

function showResult(){
  quizContainer.style.display="none";
  resultCard.style.display="block";
  scoreText.textContent=score+" / "+quiz.length;
}

function restartQuiz(){
  i=0;score=0;
  answers.fill(null);
  quiz.forEach(q=>delete q.userPick);
  resultCard.style.display="none";
  startCard.style.display="block";
}
</script>

</body>
</html>
