}
*{box-sizing:border-box;margin:0;padding:0}

button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

.en{font-family:'Inter',system-ui,sans-serif;direction:ltr;text-align:left}
.ar{font-family:'Cairo',sans-serif;direction:rtl;text-align:right}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
.hidden{display:none!important}

.sub{color:var(--muted);margin-top:4px;font-size:15px}

.pill{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--border);backdrop-filter:blur(8px);box-shadow:var(--shadow)}
.sacred{margin:22px 0;text-align:center;padding:24px 18px;border-radius:24px;background:linear-gradient(135deg,#fef3c7,#fde68a,#fcd34d);border:2px solid rgba(245,158,11,.25);box-shadow:0 10px 40px rgba(245,158,11,.28);animation:rise .7s .1s var(--ease) both}

.lec input{width:20px;height:20px;accent-color:#10b981}
.chip{display:inline-block;padding:2px 12px;border-radius:999px;color:#fff;font-weight:700;font-size:13px;font-family:'Inter',sans-serif;direction:ltr}
.row{display:flex;justify-content:space-between;align-items:center;min-height:44px;gap:12px;border-top:1px dashed var(--border)}
.row label.t{font-weight:600;font-size:15px}
.sw{position:relative;width:52px;height:30px;flex:none}

.cta{text-align:center;margin:24px 0 8px}
.start{width:100%;max-width:420px;height:60px;border-radius:16px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-size:20px;font-weight:700;box-shadow:0 8px 24px rgba(16,185,129,.4);animation:pulse 2s infinite;transition:transform .28s var(--ease)}
.start:hover{transform:translateY(-2px)}
.hint{margin-top:10px;font-size:12px;color:var(--muted)}
.foot{margin-top:22px;text-align:center;color:var(--muted);font-size:13px}
.foot b{color:var(--text);font-size:15px}
.err{color:var(--err);font-size:13px;margin-top:8px;text-align:center}

/* ---------- Quiz ---------- */

.ib{width:44px;height:44px;border-radius:12px;font-size:18px;display:grid;place-items:center;background:var(--card);border:1px solid var(--border)}

.qwrap{max-width:780px;margin:0 auto;padding:18px 14px 80px}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}

.qtext{font-size:1.25rem;font-weight:600;line-height:1.7;font-family:'Inter',sans-serif;direction:ltr;text-align:left}
.qar{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--tint);font-size:1.05rem;direction:rtl;text-align:right;animation:slide .3s var(--ease) both}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;border-radius:14px;border:2px solid var(--border);background:var(--card);text-align:left;direction:ltr;transition:transform .28s var(--ease),border-color .28s var(--ease),box-shadow .28s var(--ease);position:relative}
.opt:not(:disabled):hover{transform:translateY(-2px);border-color:var(--g1);box-shadow:0 6px 18px rgba(15,23,42,.1)}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;font-weight:700;display:grid;place-items:center;font-family:'Inter',sans-serif}
.opt .b{flex:1;font-family:'Inter',sans-serif;font-size:16px}

.opt .mk{flex:none;font-size:20px;font-weight:700;width:24px;text-align:center}
.opt:disabled{cursor:default}
.opt.right{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:#16a34a;color:#fff}

.opt.wrong{background:linear-gradient(135deg,#ef4444,#dc2626);border-color:#dc2626;color:#fff}
.opt.wrong .oar{color:#fee2e2;border-color:#fecaca}
.opt.right .l,.opt.wrong .l{background:rgba(255,255,255,.25)}
.opt.reveal{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.3)}
.opt.reveal .mk{color:#22c55e}
.opt.dim{opacity:.6}
.exp{margin-top:18px;animation:slide .35s var(--ease) both}
.exp .hd{font-weight:700;font-size:17px;margin-bottom:8px}
.exp .hd.ok{color:var(--ok)}.exp .hd.no{color:var(--err)}
.eb{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:15px;line-height:1.7;margin-bottom:8px}
.eb.en{font-family:'Inter',sans-serif}
.eb.ar{background:var(--tint);border-color:transparent}
